apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osiris-web.fullname" . }}
  labels:
    {{- include "osiris-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "osiris-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "osiris-web.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "osiris-web.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: osiris-web
          image: {{ include "osiris-web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --host
            - {{ .Values.server.host | quote }}
            - --port
            - {{ .Values.server.port | quote }}
            {{- if or .Values.server.token .Values.server.existingTokenSecret }}
            - --token
            - $(OSIRIS_WEB_TOKEN)
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if or .Values.server.token .Values.server.existingTokenSecret }}
            - name: OSIRIS_WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingTokenSecret | default (include "osiris-web.fullname" .) }}
                  key: token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: workspace
              mountPath: /home/osiris/.osiris-server
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "osiris-web.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
