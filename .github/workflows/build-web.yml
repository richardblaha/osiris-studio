name: Build Web

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Explicit input, not github.event_name: inside a reusable workflow,
      # event_name inherits the *top-level* caller's triggering event (e.g.
      # "push" from release.yml's own `on: push: tags`), never "workflow_call"
      # itself — so gating on event_name here silently never publishes.
      publish:
        description: 'Push the Docker image + Helm chart to GHCR (a real release, not a CI-only build).'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  server-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm --filter @osiris-studio/branding build
      - run: pnpm --filter @osiris-studio/branding sync:theme
      - run: pnpm --filter @osiris-studio/branding render:icons
      # First-party extensions are bundled into the REH server as built-ins by
      # build:shell; package their .vsix first. Driven through turbo so the
      # workspace packages they bundle (container-sync, lm-proxy) are built
      # before esbuild resolves them.
      - run: pnpm exec turbo run package --filter="./extensions/*"
      - run: pnpm --filter @osiris-studio/web run prepare:shell
      - run: pnpm --filter @osiris-studio/web build:shell

      - name: Inspect build output
        run: |
          echo "== apps/osiris-web/.build =="
          ls -la apps/osiris-web/.build || true
          echo "== vscode-reh-web* / out-vscode-reh-web* trees =="
          find apps/osiris-web/.build -maxdepth 2 \
            \( -name 'vscode-reh-web*' -o -name 'out-vscode-reh-web*' \) -print
          echo "== sizes =="
          du -sh apps/osiris-web/.build/* 2>/dev/null || true

      - name: Stage the server bundle
        run: |
          set -euo pipefail
          bundle=$(find apps/osiris-web/.build -maxdepth 4 -type d \
            -name 'vscode-reh-web-*' ! -name 'out-*' -print -quit || true)
          if [ -z "$bundle" ]; then
            echo "::error::no vscode-reh-web-* bundle produced by build:shell"
            find apps/osiris-web/.build -maxdepth 4 -type d | sort
            exit 1
          fi
          echo "REH bundle: $bundle ($(du -sh "$bundle" | cut -f1))"
          test -e "$bundle/out/server-main.js" || {
            echo "::error::bundle looks incomplete — no out/server-main.js"; ls -la "$bundle"; exit 1;
          }
          tar -C "$(dirname "$bundle")" -czf apps/osiris-web/osiris-web-server.tar.gz "$(basename "$bundle")"
          ls -la apps/osiris-web/osiris-web-server.tar.gz

      - name: Smoke test the CLI wrapper
        run: node apps/osiris-web/server/index.mjs --help

      - uses: actions/upload-artifact@v4
        with:
          name: osiris-web-server
          path: apps/osiris-web/osiris-web-server.tar.gz
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: server-bundle
    # Only release.yml's call (with `publish: true`) pushes to GHCR; a manual
    # workflow_dispatch run (publish defaults to false) just builds, for
    # CI-only checks.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/osiris-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # server-bundle already did the expensive part (clone OpenVSCode Server,
      # npm ci, gulp build) natively on the runner; reuse that artifact instead
      # of repeating it inside the Docker build (redundant, and prone to
      # failing under buildkit's sandboxed container — disk/memory pressure
      # from doing the whole multi-GB build twice in one release run).
      #
      # Extracted entirely outside the repo (not under `context: .`) and fed
      # to the build as a separate named context (see `build-contexts` below):
      # apps/osiris-web/.dockerignore's `**/.build` and `**/node_modules`
      # would otherwise strip this out of the main context — it's normally
      # produced *inside* a Docker build stage, which bypasses .dockerignore
      # entirely; there's no such stage here anymore, and the REH bundle ships
      # its own node_modules (native modules gulp can't bundle, e.g. node-pty).
      - name: Download server bundle
        uses: actions/download-artifact@v4
        with:
          name: osiris-web-server
          path: /tmp/osiris-web-server-artifact

      - name: Extract server bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/osiris-web-server-extracted
          tar -xzf /tmp/osiris-web-server-artifact/osiris-web-server.tar.gz -C /tmp/osiris-web-server-extracted
          ls -la /tmp/osiris-web-server-extracted

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}/osiris-web"
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            tags="$image:${{ github.ref_name }}"
            # Skip :latest for a prerelease tag (contains a "-", e.g. v1.2.3-beta.1).
            if [[ "${{ github.ref_name }}" != *-* ]]; then
              tags="$tags,$image:latest"
            fi
          else
            tags="osiris-web:ci"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build image (push only on a release)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          build-contexts: |
            reh-bundle=/tmp/osiris-web-server-extracted
          file: apps/osiris-web/Dockerfile
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  helm:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint deploy/helm/osiris-web

      - name: Resolve chart version
        id: ver
        run: |
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "appVersion=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "appVersion=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        run: |
          mkdir -p dist-helm
          helm package deploy/helm/osiris-web \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.appVersion }}" \
            --destination dist-helm

      - uses: actions/upload-artifact@v4
        with:
          name: osiris-web-helm-chart
          path: dist-helm/*.tgz
          if-no-files-found: error

      - name: Log in to GHCR (Helm OCI push)
        if: inputs.publish
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push chart (release only)
        if: inputs.publish
        run: helm push dist-helm/*.tgz "oci://ghcr.io/${{ github.repository }}/charts"
