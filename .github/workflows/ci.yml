name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Turbo build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Branding's own test suite asserts against the real synced theme files
      # (osiris-theme's current release), not a local fixture.
      - name: Sync branding from osiris-theme
        run: pnpm --filter @osiris-studio/branding sync:theme

      - name: Test
        run: pnpm test

      - name: Package extensions (.vsix)
        run: pnpm --filter "./extensions/*" package

      - uses: actions/upload-artifact@v4
        with:
          name: osiris-extensions-vsix
          path: extensions/*/*.vsix
          if-no-files-found: error
