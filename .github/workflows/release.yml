name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # write: the web leg pushes the Docker image + Helm chart to GHCR on a release.
  packages: write

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm build
      - run: pnpm --filter "./extensions/*" package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/*.vsix

  web:
    uses: ./.github/workflows/build-web.yml
    with:
      publish: true
    secrets: inherit

  desktop:
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [extensions, web, desktop]
    # Desktop is best-effort: ship whatever platforms rebranded cleanly, but
    # never block the release on a desktop leg.
    if: ${{ !cancelled() && needs.extensions.result == 'success' && needs.web.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{vsix,osiris-web-server,osiris-web-helm-chart,osiris-desktop-*}"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          # First-party extensions
          find artifacts -name '*.vsix' -exec cp -v {} dist/ \;

          # Web server bundle (already a tarball from build-web.yml)
          find artifacts -name 'osiris-web-server.tar.gz' \
            -exec cp -v {} dist/osiris-web-server-linux-x64.tar.gz \;

          # Helm chart (also pushed as an OCI artifact to GHCR by build-web.yml)
          find artifacts -name 'osiris-web-*.tgz' -exec cp -v {} dist/ \;

          # Desktop artifacts (best-effort; some may be absent):
          #   Osiris-<os>-<arch>-<release>.{tar.gz,zip}  — portable archives
          #   Osiris-linux-x64-<release>.AppImage        — portable Linux app
          #   Osiris-linux-x64-<release>.snap            — classic-confinement snap
          #   Osiris-linux-x64-<release>_amd64.deb       — Debian/Ubuntu package
          #   Osiris-linux-x64-<release>.x86_64.rpm      — Fedora/RHEL package
          #   Osiris-linux-x64-<release>.flatpak         — single-file Flatpak bundle
          find artifacts -type f -name 'Osiris-*' \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.snap' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \) \
            -exec cp -v {} dist/ \;

          echo "---- release assets ----"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Osiris Studio ${{ github.ref_name }}

            See `CHANGELOG.md` for the full change list. Branding (colour theme,
            file icons, app icons, watermarks, font) is synced from the current
            release of [`richardblaha/osiris-theme`](https://github.com/richardblaha/osiris-theme).

            **Assets**
            - `*.vsix` — first-party extensions (osiris-workspace)
            - `osiris-web-server-*.tar.gz` — browser-served web server bundle
              (`node server/index.mjs --port 3000`)
            - `osiris-web-*.tgz` — Helm chart for the web server (also pushed as an
              OCI artifact: `helm install osiris-web oci://ghcr.io/${{ github.repository }}/charts/osiris-web --version <ver>`)
            - Docker: `ghcr.io/${{ github.repository }}/osiris-web:${{ github.ref_name }}`
              (`docker run -p 3000:3000 ghcr.io/${{ github.repository }}/osiris-web:${{ github.ref_name }}`)
            - `Osiris-<os>-<arch>-*.{tar.gz,zip}` — desktop app (rebranded VSCodium
              prebuilt; portable, unsigned). Linux: extract and run `bin/osiris`.
            - `Osiris-linux-x64-*.AppImage` — portable Linux app (`chmod +x` then
              run; falls back to `--no-sandbox` when user namespaces are locked down).
            - `Osiris-linux-x64-*.snap` — classic-confinement snap
              (`sudo snap install --dangerous --classic Osiris-linux-x64-*.snap`).
            - `Osiris-linux-x64-*_amd64.deb` — Debian/Ubuntu package
              (`sudo apt install ./Osiris-linux-x64-*_amd64.deb`).
            - `Osiris-linux-x64-*.x86_64.rpm` — Fedora/RHEL package
              (`sudo dnf install ./Osiris-linux-x64-*.x86_64.rpm`).
            - `Osiris-linux-x64-*.flatpak` — single-file Flatpak bundle, not on
              Flathub (`flatpak install --user ./Osiris-linux-x64-*.flatpak`).
